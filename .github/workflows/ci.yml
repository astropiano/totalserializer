name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for NuGet Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required by GitVersion
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.x
            10.x

      - name: Restore
        run: dotnet restore TotalSerializer.Complete.sln

      - name: Build
        run: |
          VERSION_ARGS=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Pin the package version to the tag name; GitVersion's branch-label
            # naming does not produce a clean version for tag builds.
            VERSION_ARGS="-p:Version=${GITHUB_REF_NAME#v} -p:DisableGitVersionTask=true"
          fi
          dotnet build TotalSerializer.Complete.sln -c Release --no-restore $VERSION_ARGS

      - name: Test
        run: dotnet test TotalSerializer.Complete.sln -c Release --no-build

      - name: Upload NuGet packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packages-local/*.nupkg

      - name: NuGet login (OIDC -> temporary API key)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: alexander_timmermans

      - name: Publish to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "packages-local/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
